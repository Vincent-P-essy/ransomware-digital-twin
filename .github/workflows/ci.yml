name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-dev.lock
      - name: Install locked tooling and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.lock -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Static quality
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy src/ransomware_twin
          python -m compileall -q src tests scripts
      - name: Unit, integration, and end-to-end tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -t . -v
      - name: Safety, determinism, and golden-data gates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/safety_static_gate.py
          python scripts/quality_gate.py
          python scripts/verify_golden.py
      - name: Build and smoke-test wheel outside the source tree
        if: matrix.python-version == '3.12'
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m venv /tmp/ransomware-wheel-smoke
          /tmp/ransomware-wheel-smoke/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          cd /tmp
          /tmp/ransomware-wheel-smoke/bin/ransomware-twin validate

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate Compose deployment
        run: docker compose -f compose.yaml config --quiet
      - name: Build runtime image
        run: docker build --tag ransomware-digital-twin:ci .
      - name: Validate in a constrained runtime
        run: >-
          docker run --rm --read-only --cap-drop=ALL
          --security-opt=no-new-privileges
          ransomware-digital-twin:ci ransomware-twin validate
      - name: Smoke-test the read-only API and dashboard
        run: |
          docker run --detach --rm --name ransomware-twin-ci \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:size=16m,noexec,nosuid,nodev,mode=1777 \
            -p 127.0.0.1:18080:8080 ransomware-digital-twin:ci
          trap 'docker stop ransomware-twin-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/v1/health; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs ransomware-twin-ci; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/ >/dev/null
